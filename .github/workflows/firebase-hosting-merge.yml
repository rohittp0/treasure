# Deploys Hosting, Firestore rules and Cloud Functions on every push to main.
# Backend setup (secrets, variables and service-account roles) is described in README.md under "Build and deploy".

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# Never run two production deploys at once; a newer push waits for the older one.
concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm test
      - name: Firestore rules tests (emulator)
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-treasure-friend-tests 'node tests/friend-rules.rules.mjs'
      - name: WhatsApp function tests (emulator, Twilio mocked)
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-treasure-friend-tests 'node --test tests/*.emulator.mjs'

  deploy_hosting:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TREASUREHUNCH }}
          channelId: live
          projectId: treasurehunch

  deploy_backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: npm ci
        working-directory: functions
      - name: Check deploy configuration
        env:
          DEPLOY_KEY: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          EMAIL_FROM: ${{ vars.CHALLENGE_EMAIL_FROM }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Add the FIREBASE_DEPLOY_SERVICE_ACCOUNT repository secret."; exit 1; }
          [ -n "$EMAIL_FROM" ] || { echo "::error::Add the CHALLENGE_EMAIL_FROM repository variable."; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      # The functions read CHALLENGE_EMAIL_FROM as a parameter; CI cannot answer the deploy prompt for it.
      # The committed file already holds the WhatsApp parameters, so only this line is replaced.
      - name: Write function parameters
        run: |
          grep -v '^CHALLENGE_EMAIL_FROM=' functions/.env.treasurehunch > functions/.env.params || true
          { printf 'CHALLENGE_EMAIL_FROM=%s\n' "$EMAIL_FROM"; cat functions/.env.params; } > functions/.env.treasurehunch
          rm functions/.env.params
        env:
          EMAIL_FROM: ${{ vars.CHALLENGE_EMAIL_FROM }}
      # RESEND_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and OTP_HMAC_KEY stay in Secret Manager; the deploy only references them.
      - name: Deploy Firestore rules and Cloud Functions
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,functions --project treasurehunch --non-interactive --force
